<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AKKINO | Catálogo Oficial</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    linear-gradient(rgba(8,8,8,.82),rgba(8,8,8,.82)),
    url("fondo.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;

    color:white;

    padding:30px;
    padding-bottom:110px;
}


/* =========================================================
HEADER
========================================================= */

.header{

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    margin-bottom:25px;
}

.logo{

    width:180px;
    height:auto;
    display:block;
}

.subtitulo{

    margin-top:10px;

    color:#c89d38;

    font-size:13px;

    letter-spacing:4px;

    font-weight:bold;

    text-transform:uppercase;
}


/* =========================================================
MODOS
========================================================= */

.modos{

    display:flex;

    justify-content:center;

    gap:10px;

    margin:0 auto 25px;

    max-width:500px;
}

.modo{

    flex:1;

    padding:13px 10px;

    border-radius:12px;

    border:1px solid #333;

    background:#181818;

    color:#aaa;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.modo:hover{

    border-color:#c89d38;

    color:white;
}

.modo.activo{

    background:#c89d38;

    color:#111;

    border-color:#c89d38;
}


/* =========================================================
BUSCADOR
========================================================= */

#buscar{

    width:100%;

    max-width:700px;

    margin:0 auto 25px;

    display:block;

    padding:16px;

    background:#181818;

    color:white;

    border:1px solid #333;

    border-radius:12px;

    font-size:16px;

    outline:none;
}

#buscar:focus{

    border-color:#c89d38;
}


/* =========================================================
CATEGORÍAS
========================================================= */

.categorias{

    max-width:1200px;

    margin:0 auto 30px;

    display:flex;

    justify-content:center;

    gap:8px;

    flex-wrap:wrap;
}

.categoria-btn{

    border:1px solid #333;

    background:#181818;

    color:#aaa;

    padding:9px 13px;

    border-radius:20px;

    cursor:pointer;

    font-size:12px;

    transition:.2s;
}

.categoria-btn:hover{

    border-color:#c89d38;

    color:white;
}

.categoria-btn.activa{

    background:#c89d38;

    border-color:#c89d38;

    color:#111;

    font-weight:bold;
}


/* =========================================================
PRODUCTOS
========================================================= */

#productos{

    display:grid;

    grid-template-columns:repeat(6,minmax(0,1fr));

    gap:18px;

    max-width:1800px;

    margin:0 auto;
}

.card{

    background:#171717;

    border-radius:18px;

    overflow:hidden;

    border:1px solid #262626;

    transition:.25s;

    min-width:0;
}

.card:hover{

    transform:translateY(-6px);

    border-color:#c89d38;
}

.card img{

    width:100%;

    height:270px;

    object-fit:cover;

    background:#222;

    display:block;
}


/* =========================================================
INFO
========================================================= */

.info{

    padding:15px;
}

.nombre{

    font-size:16px;

    font-weight:bold;

    line-height:1.35;

    min-height:55px;

    overflow-wrap:anywhere;
}

.categoria-producto{

    margin-top:7px;

    color:#aaa;

    font-size:11px;

    min-height:16px;
}


/* =========================================================
PRECIO PARTICULAR
========================================================= */

.precio{

    margin-top:12px;

    font-size:25px;

    font-weight:bold;

    color:#ffcc66;
}

.precio-label{

    margin-top:10px;

    font-size:11px;

    color:#999;

    text-transform:uppercase;

    letter-spacing:.5px;
}

.promos{

    margin-top:12px;

    display:flex;

    flex-direction:column;

    gap:6px;
}

.promo{

    padding:7px;

    border-radius:8px;

    text-align:center;

    font-size:12px;

    font-weight:bold;

    color:#3ddc84;

    background:rgba(61,220,132,.10);

    border:1px solid rgba(61,220,132,.30);
}


/* =========================================================
MAYORISTA
========================================================= */

.mayorista-titulo{

    margin-top:12px;

    font-size:12px;

    font-weight:bold;

    color:#c89d38;

    text-transform:uppercase;
}

.mayorista-precio{

    margin-top:6px;

    font-size:24px;

    font-weight:bold;

    color:#ffcc66;
}

.mayorista-unidad{

    margin-top:3px;

    font-size:11px;

    color:#aaa;
}

.nivel-mayorista{

    margin-top:10px;

    padding:7px;

    border-radius:8px;

    text-align:center;

    font-size:11px;

    line-height:1.4;

    background:rgba(200,157,56,.10);

    border:1px solid rgba(200,157,56,.25);

    color:#ddd;
}


/* =========================================================
STOCK
========================================================= */

.stock{

    margin-top:12px;

    font-size:13px;

    font-weight:bold;

    min-height:20px;
}

.stock.disponible{

    color:#3ddc84;
}

.stock.apedido{

    color:#f5c542;
}

.stock.sinstock{

    color:#ff5a5a;
}


/* =========================================================
WHATSAPP
========================================================= */

.whatsapp{

    display:block;

    margin-top:16px;

    padding:12px 8px;

    background:#25D366;

    border-radius:10px;

    text-align:center;

    text-decoration:none;

    color:white;

    font-size:14px;

    font-weight:bold;

    transition:.2s;
}

.whatsapp:hover{

    background:#1fb85a;
}


/* =========================================================
AGREGAR
========================================================= */

.agregar{

    display:block;

    width:100%;

    margin-top:14px;

    padding:12px 8px;

    background:#c89d38;

    border:none;

    border-radius:10px;

    text-align:center;

    color:#111;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.agregar:hover{

    background:#e0b653;
}

.agregar:disabled{

    background:#333;

    color:#777;

    cursor:not-allowed;
}


/* =========================================================
CANTIDAD
========================================================= */

.cantidad{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin-top:14px;
}

.cantidad button{

    width:35px;

    height:35px;

    border-radius:8px;

    border:1px solid #444;

    background:#222;

    color:white;

    font-size:20px;

    cursor:pointer;
}

.cantidad button:hover{

    border-color:#c89d38;
}

.cantidad span{

    min-width:35px;

    text-align:center;

    font-size:16px;

    font-weight:bold;
}


/* =========================================================
PAGINACIÓN
========================================================= */

.paginacion{

    display:flex;

    justify-content:center;

    align-items:center;

    gap:7px;

    margin:35px auto 20px;

    flex-wrap:wrap;
}

.pagina-btn{

    min-width:40px;

    height:40px;

    padding:0 12px;

    border-radius:9px;

    border:1px solid #333;

    background:#181818;

    color:#aaa;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}

.pagina-btn:hover{

    border-color:#c89d38;

    color:white;
}

.pagina-btn.activa{

    background:#c89d38;

    color:#111;

    border-color:#c89d38;
}

.pagina-btn:disabled{

    opacity:.35;

    cursor:not-allowed;
}

.paginacion-info{

    text-align:center;

    font-size:12px;

    color:#777;

    margin-bottom:20px;
}


/* =========================================================
BARRA CARRITO
========================================================= */

.carrito-barra{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    z-index:1000;

    background:rgba(15,15,15,.97);

    border-top:1px solid #333;

    padding:12px 20px;

    display:none;

    box-shadow:0 -5px 20px rgba(0,0,0,.4);
}

.carrito-contenido{

    max-width:1000px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:20px;
}

.carrito-info{

    font-size:14px;
}

.carrito-info strong{

    color:#ffcc66;
}

.carrito-boton{

    background:#25D366;

    color:white;

    border:none;

    border-radius:10px;

    padding:13px 20px;

    font-weight:bold;

    cursor:pointer;

    font-size:14px;
}


/* =========================================================
MODAL
========================================================= */

.modal{

    display:none;

    position:fixed;

    z-index:2000;

    inset:0;

    background:rgba(0,0,0,.75);

    padding:20px;

    align-items:center;

    justify-content:center;
}

.modal.activo{

    display:flex;
}

.modal-contenido{

    width:100%;

    max-width:600px;

    max-height:90vh;

    overflow-y:auto;

    background:#171717;

    border:1px solid #333;

    border-radius:18px;

    padding:22px;

    box-shadow:0 20px 50px rgba(0,0,0,.6);
}

.modal-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:20px;
}

.modal-header h2{

    font-size:20px;
}

.cerrar{

    background:none;

    border:none;

    color:#aaa;

    font-size:28px;

    cursor:pointer;
}


/* =========================================================
ITEM CARRITO
========================================================= */

.item-carrito{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:12px;

    padding:14px 0;

    border-bottom:1px solid #292929;
}

.item-nombre{

    flex:1;

    font-size:14px;

    font-weight:bold;
}

.item-precio{

    font-size:13px;

    color:#aaa;

    margin-top:4px;
}

.item-subtotal{

    font-size:12px;

    color:#c89d38;

    margin-top:4px;
}

.item-controles{

    display:flex;

    align-items:center;

    gap:7px;
}

.item-controles button{

    width:30px;

    height:30px;

    border:1px solid #444;

    background:#222;

    color:white;

    border-radius:7px;

    cursor:pointer;
}

.item-controles span{

    min-width:25px;

    text-align:center;

    font-weight:bold;
}


/* =========================================================
RESUMEN
========================================================= */

.carrito-resumen{

    margin-top:20px;

    padding-top:15px;

    border-top:1px solid #444;
}

.resumen-linea{

    display:flex;

    justify-content:space-between;

    margin-bottom:8px;

    font-size:14px;
}

.resumen-total{

    display:flex;

    justify-content:space-between;

    margin-top:12px;

    padding-top:12px;

    border-top:1px solid #333;

    font-size:20px;

    font-weight:bold;

    color:#ffcc66;
}

.proximo-nivel{

    margin-top:15px;

    padding:10px;

    border-radius:10px;

    background:rgba(200,157,56,.10);

    border:1px solid rgba(200,157,56,.25);

    color:#ddd;

    font-size:12px;

    text-align:center;

    line-height:1.5;
}


/* =========================================================
ENVIAR WHATSAPP
========================================================= */

.enviar-whatsapp{

    width:100%;

    margin-top:18px;

    padding:15px;

    background:#25D366;

    color:white;

    border:none;

    border-radius:10px;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}


/* =========================================================
VACÍO
========================================================= */

.vacio{

    text-align:center;

    color:#888;

    padding:30px 10px;
}


/* =========================================================
RESPONSIVE
========================================================= */

@media(max-width:1450px){

    #productos{

        grid-template-columns:repeat(5,minmax(0,1fr));
    }
}

@media(max-width:1150px){

    #productos{

        grid-template-columns:repeat(4,minmax(0,1fr));
    }
}

@media(max-width:900px){

    #productos{

        grid-template-columns:repeat(3,minmax(0,1fr));

        gap:14px;
    }

    .card img{

        height:250px;
    }
}

@media(max-width:600px){

    body{

        padding:10px;

        padding-bottom:90px;
    }

    .logo{

        width:145px;
    }

    .subtitulo{

        font-size:11px;

        letter-spacing:3px;
    }

    .modos{

        gap:7px;

        margin-bottom:18px;
    }

    .modo{

        font-size:11px;

        padding:11px 5px;
    }

    #buscar{

        margin-bottom:15px;

        padding:13px;

        font-size:14px;
    }

    .categorias{

        justify-content:flex-start;

        flex-wrap:nowrap;

        overflow-x:auto;

        padding-bottom:5px;

        margin-bottom:20px;
    }

    .categoria-btn{

        flex:none;
    }

    #productos{

        grid-template-columns:repeat(2,minmax(0,1fr));

        gap:10px;
    }

    .card{

        border-radius:12px;
    }

    .card:hover{

        transform:none;
    }

    .card img{

        height:190px;
    }

    .info{

        padding:10px;
    }

    .nombre{

        font-size:13px;

        min-height:48px;
    }

    .precio{

        font-size:20px;
    }

    .mayorista-precio{

        font-size:19px;
    }

    .stock{

        font-size:12px;
    }

    .agregar,
    .whatsapp{

        font-size:11px;

        padding:10px 5px;
    }

    .modal{

        padding:10px;
    }

    .modal-contenido{

        padding:15px;
    }
}

</style>

</head>


<body>


<!-- =========================================================
HEADER
========================================================= -->

<div class="header">

    <img
        src="logo%20neros.png"
        class="logo"
        alt="AKKINO">

    <div class="subtitulo">
        CATÁLOGO OFICIAL
    </div>

</div>


<!-- =========================================================
MODOS
========================================================= -->

<div class="modos">

    <button
        id="modoParticular"
        class="modo activo"
        onclick="cambiarModo('particular')">

        🛍️ PARTICULAR

    </button>


    <button
        id="modoMayorista"
        class="modo"
        onclick="cambiarModo('mayorista')">

        📦 MAYORISTA

    </button>

</div>


<!-- =========================================================
BUSCADOR
========================================================= -->

<input
    id="buscar"
    placeholder="🔍 Buscar perfume...">


<!-- =========================================================
CATEGORÍAS
========================================================= -->

<div
    id="categorias"
    class="categorias">
</div>


<!-- =========================================================
PRODUCTOS
========================================================= -->

<div id="productos"></div>


<!-- =========================================================
PAGINACIÓN
========================================================= -->

<div id="paginacion"></div>


<!-- =========================================================
BARRA CARRITO
========================================================= -->

<div
    id="carritoBarra"
    class="carrito-barra">

    <div class="carrito-contenido">

        <div
            id="carritoInfo"
            class="carrito-info">

            🛒 <strong>0</strong> unidades

        </div>


        <button
            class="carrito-boton"
            onclick="abrirCarrito()">

            VER PEDIDO

        </button>

    </div>

</div>


<!-- =========================================================
MODAL CARRITO
========================================================= -->

<div
    id="modalCarrito"
    class="modal">

    <div class="modal-contenido">


        <div class="modal-header">

            <h2>🛒 Pedido mayorista</h2>

            <button
                class="cerrar"
                onclick="cerrarCarrito()">

                ×

            </button>

        </div>


        <div id="listaCarrito"></div>


        <div
            id="resumenCarrito"
            class="carrito-resumen">
        </div>


        <button
            class="enviar-whatsapp"
            onclick="enviarPedidoWhatsApp()">

            💬 ENVIAR PEDIDO POR WHATSAPP

        </button>


    </div>

</div>


<script>


/* =========================================================
CONFIGURACIÓN
========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbxBlyQl5bl8QEHTyt4oAMSQKEqY8-kmptZg7-_mogkjwtvB0SklyqSli0t0xyFrrNQ/exec";


const WHATSAPP =
"5493417830300";


const MINIMO_MAYORISTA =
5;


const PRODUCTOS_POR_PAGINA =
30;


/* =========================================================
VARIABLES
========================================================= */

let perfumes = [];

let carrito = [];

let modoActual = "particular";

let paginaActual = 1;

let productosFiltrados = [];

let categoriaActual = "TODOS";


/* =========================================================
CONVERTIR NÚMERO
========================================================= */

function convertirNumero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;
    }


    if(typeof valor === "number"){

        return valor;
    }


    let texto =
        String(valor)
        .trim()
        .replace(/ARS/gi,"")
        .replace(/\$/g,"")
        .replace(/\s/g,"");


    /*
    Ejemplo argentino:

    15.000,00
    */

    if(
        texto.includes(".") &&
        texto.includes(",")
    ){

        texto =
            texto
            .replace(/\./g,"")
            .replace(",",".");
    }

    else if(texto.includes(",")){

        texto =
            texto.replace(",",".");
    }


    const numero =
        Number(texto);


    return isNaN(numero)
        ? 0
        : numero;
}


/* =========================================================
FORMATEAR PRECIO
========================================================= */

function formatearPrecio(valor){

    const numero =
        convertirNumero(valor);

    return numero.toLocaleString(
        "es-AR",
        {
            minimumFractionDigits:0,
            maximumFractionDigits:0
        }
    );
}


/* =========================================================
CARGAR PRODUCTOS
========================================================= */

fetch(API)

.then(respuesta => {

    if(!respuesta.ok){

        throw new Error(
            "Error HTTP " +
            respuesta.status
        );
    }

    return respuesta.json();
})

.then(data => {

    if(!Array.isArray(data)){

        console.error(
            "Respuesta API:",
            data
        );

        throw new Error(
            data.error ||
            "La API no devolvió una lista de productos."
        );
    }


    perfumes = data;

    productosFiltrados = data;


    crearCategorias();


    paginaActual = 1;

    aplicarFiltros();

})

.catch(error => {

    console.error(
        "Error cargando productos:",
        error
    );


    document
    .getElementById("productos")
    .innerHTML = `

        <div style="
        grid-column:1/-1;
        text-align:center;
        padding:50px;
        color:#ff5a5a;
        ">

            No se pudieron cargar los perfumes.<br><br>

            <span style="
            font-size:12px;
            color:#888;
            ">

            Revisá la conexión con Google Sheets.

            </span>

        </div>

    `;
});


/* =========================================================
CREAR CATEGORÍAS
========================================================= */

function crearCategorias(){

    const contenedor =
        document.getElementById(
            "categorias"
        );


    const categorias =
        [
            ...new Set(

                perfumes

                .map(p =>
                    String(
                        p.categoria || ""
                    ).trim()
                )

                .filter(Boolean)
            )
        ];


    let html = `

        <button
            class="categoria-btn activa"
            data-categoria="TODOS"
            onclick="seleccionarCategoria('TODOS')">

            TODOS

        </button>

    `;


    categorias.forEach(categoria => {

        html += `

            <button
                class="categoria-btn"
                data-categoria="${escapeHTML(categoria)}"
                onclick="seleccionarCategoria('${escapeJS(categoria)}')">

                ${escapeHTML(categoria)}

            </button>

        `;

    });


    contenedor.innerHTML = html;
}


/* =========================================================
SELECCIONAR CATEGORÍA
========================================================= */

function seleccionarCategoria(categoria){

    categoriaActual =
        categoria;


    document
    .querySelectorAll(
        ".categoria-btn"
    )
    .forEach(btn => {

        btn.classList.toggle(
            "activa",
            btn.dataset.categoria === categoria
        );

    });


    paginaActual = 1;

    aplicarFiltros();
}


/* =========================================================
BUSCADOR
========================================================= */

document
.getElementById("buscar")
.addEventListener(
    "input",
    () => {

        paginaActual = 1;

        aplicarFiltros();
    }
);


/* =========================================================
APLICAR FILTROS
========================================================= */

function aplicarFiltros(){

    const texto =

        document
        .getElementById("buscar")
        .value
        .toLowerCase()
        .trim();


    productosFiltrados =

        perfumes.filter(p => {


            const nombre =

                String(
                    p.perfume || ""
                )
                .toLowerCase();


            const categoria =

                String(
                    p.categoria || ""
                );


            const coincideTexto =

                nombre.includes(texto);


            const coincideCategoria =

                categoriaActual === "TODOS" ||

                categoria === categoriaActual;


            return (

                coincideTexto &&
                coincideCategoria

            );

        });


    mostrarPagina();
}


/* =========================================================
CAMBIAR MODO
========================================================= */

function cambiarModo(modo){

    modoActual =
        modo;


    document
    .getElementById(
        "modoParticular"
    )
    .classList
    .toggle(
        "activo",
        modo === "particular"
    );


    document
    .getElementById(
        "modoMayorista"
    )
    .classList
    .toggle(
        "activo",
        modo === "mayorista"
    );


    if(modo === "particular"){

        carrito = [];

        actualizarCarrito();
    }


    paginaActual = 1;

    mostrarPagina();
}


/* =========================================================
MOSTRAR PÁGINA
========================================================= */

function mostrarPagina(){

    const inicio =

        (paginaActual - 1) *
        PRODUCTOS_POR_PAGINA;


    const fin =

        inicio +
        PRODUCTOS_POR_PAGINA;


    const productosPagina =

        productosFiltrados
        .slice(
            inicio,
            fin
        );


    mostrar(
        productosPagina
    );


    mostrarPaginacion();
}

    if(total >= 250){

            precio:
                convertirNumero(

                    producto.precioMayorista250
                )
        };
    }


    if(total >= 100){

        return {

            minimo:100,

            titulo:"100+ unidades",

            precio:
                convertirNumero(
                    producto.precio100 ??
                    producto.precioMayorista100
                )
        };
    }


    if(total >= 50){

        return {

            minimo:50,

            titulo:"50+ unidades",

            precio:
                convertirNumero(
                    producto.precio50 ??
                    producto.precioMayorista50
                )
        };
    }


    if(total >= 30){

        return {

            minimo:30,

            titulo:"30+ unidades",

            precio:
                convertirNumero(
                    producto.precio30 ??
                    producto.precioMayorista30
                )
        };
    }


    if(total >= 20){

        return {

            minimo:20,

            titulo:"20+ unidades",

            precio:
                convertirNumero(
                    producto.precio20 ??
                    producto.precioMayorista20
                )
        };
    }


    if(total >= 10){

/* =========================================================
PAGINACIÓN
========================================================= */

function mostrarPaginacion(){

    const cont =

        document
        .getElementById(
            "paginacion"
        );


    const totalPaginas =

        Math.ceil(

            productosFiltrados.length /
            PRODUCTOS_POR_PAGINA

        );


    if(totalPaginas <= 1){

        cont.innerHTML = "";

        return;
    }


    let html = `

        <div class="paginacion">

    `;


    html += `

        <button

            class="pagina-btn"

            onclick="cambiarPagina(${paginaActual - 1})"

            ${paginaActual === 1 ? "disabled" : ""}>

            ‹

        </button>

    `;


    for(
        let i = 1;
        i <= totalPaginas;
        i++
    ){

        if(

            totalPaginas > 8 &&

            i !== 1 &&

            i !== totalPaginas &&

            Math.abs(
                i - paginaActual
            ) > 2
        ){

            if(
                i === 2 ||
                i === totalPaginas - 1
            ){

                html += `

                    <span style="
                    color:#666;
                    ">
                        ...
                    </span>

                `;
            }

            continue;
        }


        html += `

            <button

                class="pagina-btn ${
                    i === paginaActual
                    ? "activa"
                    : ""
                }"

                onclick="cambiarPagina(${i})">

                ${i}

            </button>

        `;
    }


    html += `

        <button

            class="pagina-btn"

            onclick="cambiarPagina(${paginaActual + 1})"

            ${
                paginaActual === totalPaginas
                ? "disabled"
                : ""
            }>

            ›

        </button>

    `;


    html += `

        </div>

    `;


    const inicio =

        (
            (paginaActual - 1) *
            PRODUCTOS_POR_PAGINA
        ) + 1;


    const fin =

        Math.min(

            paginaActual *
            PRODUCTOS_POR_PAGINA,

            productosFiltrados.length
        );


    html += `

        <div class="paginacion-info">

            Mostrando
            ${inicio}–${fin}
            de
            ${productosFiltrados.length}
            perfumes

        </div>

    `;


    cont.innerHTML =
        html;
}


/* =========================================================
CAMBIAR PÁGINA
========================================================= */

function cambiarPagina(pagina){

    const totalPaginas =

        Math.ceil(

            productosFiltrados.length /
            PRODUCTOS_POR_PAGINA
        );


    if(
        pagina < 1 ||
        pagina > totalPaginas
    ){

        return;
    }


    paginaActual =
        pagina;


    mostrarPagina();


    window.scrollTo({

        top:0,

        behavior:"smooth"

    });
}

function obtenerCantidad(perfume){

}


/* =========================================================
AGREGAR PRODUCTO
========================================================= */

function agregarProducto(perfume){

    const producto =

        perfumes.find(

            p =>
            p.perfume === perfume
        );


    if(!producto){

        return;
    }


    const existente =

        carrito.find(

            x =>
            x.perfume === perfume
        );


    if(existente){

        existente.cantidad++;
    }

    else{

        carrito.push({

            perfume:
                producto.perfume,

            cantidad:
                1,

            precio5:
                convertirNumero(
                    producto.precio5 ??
                    producto.precioMayorista5
                ),

            precio10:
                convertirNumero(
                    producto.precio10 ??
                    producto.precioMayorista10
                ),

            precio20:
                convertirNumero(
                    producto.precio20 ??
                    producto.precioMayorista20
                ),

            precio30:
                convertirNumero(
                    producto.precio30 ??
                    producto.precioMayorista30
                ),

            precio50:
                convertirNumero(
                    producto.precio50 ??
                    producto.precioMayorista50
                ),

            precio100:
                convertirNumero(
                    producto.precio100 ??
                    producto.precioMayorista100
                ),

            precio250:
                convertirNumero(
                    producto.precio250 ??
                    producto.precioMayorista250
                ),

            precio500:
                convertirNumero(
                    producto.precio500 ??
                    producto.precioMayorista500 ??
                    producto.precioMas500
                )

        });
    }


    actualizarCarrito();

    mostrarPagina();
}


/* =========================================================
CAMBIAR CANTIDAD
========================================================= */

function cambiarCantidad(
    perfume,
    cambio
){

    const item =

        carrito.find(

            x =>
            x.perfume === perfume
        );


    if(!item){

        if(cambio > 0){

            agregarProducto(
                perfume
            );
        }

        return;
    }


    item.cantidad +=
        cambio;


    if(item.cantidad <= 0){

        carrito =

            carrito.filter(

                x =>
                x.perfume !== perfume
            );
    }


    actualizarCarrito();

    mostrarPagina();
}


/* =========================================================
TOTAL UNIDADES
========================================================= */

function totalUnidades(){

    return carrito.reduce(

        (
            total,
            item
        ) =>

        total +
        item.cantidad,

        0
    );
}


/* =========================================================
PRECIO MAYORISTA DEL CARRITO
========================================================= */

function obtenerPrecioCarrito(
    item,
    total
){

    if(total >= 500){

        return item.precio500;
    }


    if(total >= 250){

        return item.precio250;
    }


    if(total >= 100){

        return item.precio100;
    }


    if(total >= 50){

        return item.precio50;
    }


    if(total >= 30){

        return item.precio30;
    }


    if(total >= 20){

        return item.precio20;
    }


    if(total >= 10){

        return item.precio10;
    }


    return item.precio5;
}

    }


    mensaje += `

━━━━━━━━━━━━━━━

📊 Escala mayorista: ${nivel}

📦 Total de unidades: ${total}

💰 TOTAL DEL PEDIDO:
$${formatearPrecio(totalPedido)}

━━━━━━━━━━━━━━━

Quedo atento para confirmar disponibilidad y coordinar el pedido.

Gracias 🙌
`;


    const url =

        `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje)}`;


    window.open(
        url,
        "_blank"
    );
}


/* =========================================================
ESCAPAR HTML
========================================================= */

function escapeHTML(text){

    return String(
        text ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


/* =========================================================
ESCAPAR JAVASCRIPT
========================================================= */

function escapeJS(text){

    return String(
        text ?? ""
    )

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /'/g,
        "\\'"
    )

    .replace(
        /\r/g,
        ""
    )

    .replace(
        /\n/g,
        "\\n"
    );
}


/* =========================================================
CERRAR MODAL TOCANDO AFUERA
========================================================= */

document
.getElementById(
    "modalCarrito"
)
.addEventListener(
    "click",
    function(e){

        if(
            e.target === this
        ){

            cerrarCarrito();
        }
    }
);

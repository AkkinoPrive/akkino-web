<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AKKINO | Catálogo Oficial</title>

<link
rel="icon"
type="image/png"
href="favicon.png">

<style>

/* =========================================================
GENERAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    background:
    linear-gradient(
        rgba(8,8,8,.84),
        rgba(8,8,8,.84)
    ),
    url("fondo.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;

    color:white;

    padding:30px;

    padding-bottom:110px;
}


/* =========================================================
HEADER
========================================================= */

.header{

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    margin-bottom:25px;
}


.marca{
    display:flex;
    justify-content:center;
    align-items:center;
}

.marca img{
    width:320px;
    max-width:70vw;
    height:auto;
    display:block;
}


.subtitulo{

    margin-top:8px;

    color:#999;

    font-size:12px;

    letter-spacing:4px;

    text-transform:uppercase;
}


/* =========================================================
MODO PARTICULAR / MAYORISTA
========================================================= */

.modos{

    display:flex;

    justify-content:center;

    gap:10px;

    margin:0 auto 25px;

    max-width:500px;
}


.modo{

    flex:1;

    padding:13px 10px;

    border-radius:12px;

    border:1px solid #333;

    background:#181818;

    color:#aaa;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}


.modo:hover{

    border-color:#c89d38;

    color:white;
}


.modo.activo{

    background:#c89d38;

    border-color:#c89d38;

    color:#111;
}


/* =========================================================
BUSCADOR
========================================================= */

#buscar{

    width:100%;

    max-width:700px;

    margin:0 auto 20px;

    display:block;

    padding:16px;

    border-radius:12px;

    border:1px solid #333;

    background:#181818;

    color:white;

    font-size:16px;

    outline:none;
}


#buscar:focus{

    border-color:#c89d38;
}


/* =========================================================
CATEGORÍAS
========================================================= */

.categorias{

    max-width:1500px;

    margin:0 auto 30px;

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:8px;
}


.categoria-btn{

    padding:9px 13px;

    border-radius:20px;

    border:1px solid #333;

    background:#181818;

    color:#aaa;

    cursor:pointer;

    font-size:12px;

    transition:.2s;
}


.categoria-btn:hover{

    border-color:#c89d38;

    color:white;
}


.categoria-btn.activa{

    background:#c89d38;

    border-color:#c89d38;

    color:#111;

    font-weight:bold;
}


/* =========================================================
PRODUCTOS
========================================================= */

#productos{

    display:grid;

    grid-template-columns:
    repeat(
        6,
        minmax(0,1fr)
    );

    gap:18px;

    max-width:1800px;

    margin:0 auto;
}


.card{

    background:#171717;

    border:1px solid #292929;

    border-radius:18px;

    overflow:hidden;

    min-width:0;

    transition:.25s;
}


.card:hover{

    transform:
    translateY(-5px);

    border-color:#c89d38;
}


.card img{

    width:100%;

    height:270px;

    display:block;

    object-fit:cover;

    background:#222;
}


/* =========================================================
INFO PRODUCTO
========================================================= */

.info{

    padding:15px;
}


.nombre{

    font-size:15px;

    line-height:1.35;

    font-weight:bold;

    min-height:55px;

    overflow-wrap:anywhere;
}


.categoria-producto{

    margin-top:6px;

    min-height:16px;

    font-size:10px;

    color:#888;
}


/* =========================================================
PARTICULAR
========================================================= */

.precio-label{

    margin-top:12px;

    color:#999;

    font-size:10px;

    font-weight:bold;

    letter-spacing:.5px;
}


.precio{

    margin-top:5px;

    font-size:24px;

    font-weight:bold;

    color:#ffcc66;
}


.promos{

    display:flex;

    flex-direction:column;

    gap:6px;

    margin-top:12px;
}


.promo{

    background:
    rgba(61,220,132,.10);

    border:
    1px solid
    rgba(61,220,132,.28);

    color:#3ddc84;

    padding:7px;

    border-radius:8px;

    text-align:center;

    font-size:11px;

    font-weight:bold;
}


/* =========================================================
MAYORISTA
========================================================= */

.mayorista-titulo{

    margin-top:12px;

    font-size:11px;

    font-weight:bold;

    color:#c89d38;
}


.mayorista-precio{

    margin-top:5px;

    font-size:24px;

    font-weight:bold;

    color:#ffcc66;
}


.mayorista-unidad{

    margin-top:3px;

    color:#888;

    font-size:11px;
}


.nivel-mayorista{

    margin-top:10px;

    padding:8px;

    border-radius:8px;

    background:
    rgba(200,157,56,.10);

    border:
    1px solid
    rgba(200,157,56,.25);

    color:#ddd;

    font-size:11px;

    line-height:1.5;

    text-align:center;
}


/* =========================================================
STOCK
========================================================= */

.stock{

    margin-top:12px;

    min-height:18px;

    font-size:12px;

    font-weight:bold;
}


.stock.disponible{

    color:#3ddc84;
}


.stock.apedido{

    color:#f5c542;
}


.stock.sinstock{

    color:#ff5a5a;
}


/* =========================================================
AGREGAR
========================================================= */

.agregar{

    width:100%;

    display:block;

    margin-top:13px;

    padding:11px 7px;

    border:none;

    border-radius:9px;

    background:#c89d38;

    color:#111;

    font-size:12px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}


.agregar:hover{

    background:#e0b653;
}


.agregar:disabled{

    background:#333;

    color:#777;

    cursor:not-allowed;
}


/* =========================================================
CONTADOR + / -
========================================================= */

.cantidad{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:8px;

    margin-top:13px;
}


.cantidad button{

    width:34px;

    height:34px;

    border-radius:8px;

    border:1px solid #444;

    background:#222;

    color:white;

    font-size:19px;

    cursor:pointer;
}


.cantidad button:hover{

    border-color:#c89d38;
}


.cantidad span{

    min-width:35px;

    text-align:center;

    font-weight:bold;
}


/* =========================================================
PAGINACIÓN
========================================================= */

.paginacion{

    display:flex;

    justify-content:center;

    align-items:center;

    flex-wrap:wrap;

    gap:7px;

    margin:35px auto 20px;
}


.pagina-btn{

    min-width:40px;

    height:40px;

    padding:0 12px;

    border-radius:9px;

    border:1px solid #333;

    background:#181818;

    color:#aaa;

    font-weight:bold;

    cursor:pointer;
}


.pagina-btn.activa{

    background:#c89d38;

    color:#111;

    border-color:#c89d38;
}


.pagina-btn:disabled{

    opacity:.35;

    cursor:not-allowed;
}


.paginacion-info{

    text-align:center;

    color:#777;

    font-size:12px;

    margin-bottom:20px;
}


/* =========================================================
BARRA CARRITO
========================================================= */

.carrito-barra{

    position:fixed;

    left:0;

    right:0;

    bottom:0;

    z-index:1000;

    display:none;

    padding:12px 20px;

    background:
    rgba(15,15,15,.98);

    border-top:1px solid #333;

    box-shadow:
    0 -5px 20px
    rgba(0,0,0,.4);
}


.carrito-contenido{

    max-width:1000px;

    margin:auto;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;
}


.carrito-info{

    font-size:13px;
}


.carrito-info strong{

    color:#ffcc66;
}


.carrito-boton{

    border:none;

    border-radius:10px;

    padding:12px 18px;

    background:#25D366;

    color:white;

    font-weight:bold;

    cursor:pointer;
}


/* =========================================================
MODAL CARRITO
========================================================= */

.modal{

    display:none;

    position:fixed;

    inset:0;

    z-index:2000;

    padding:20px;

    background:
    rgba(0,0,0,.78);

    align-items:center;

    justify-content:center;
}


.modal.activo{

    display:flex;
}


.modal-contenido{

    width:100%;

    max-width:620px;

    max-height:90vh;

    overflow-y:auto;

    padding:22px;

    border-radius:18px;

    border:1px solid #333;

    background:#171717;
}


.modal-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:18px;
}


.modal-header h2{

    font-size:20px;
}


.cerrar{

    background:none;

    border:none;

    color:#aaa;

    font-size:28px;

    cursor:pointer;
}


/* =========================================================
ITEM CARRITO
========================================================= */

.item-carrito{

    display:flex;

    justify-content:space-between;

    align-items:center;

    gap:12px;

    padding:14px 0;

    border-bottom:
    1px solid #292929;
}


.item-datos{

    flex:1;
}


.item-nombre{

    font-size:14px;

    font-weight:bold;
}


.item-precio{

    margin-top:4px;

    font-size:12px;

    color:#aaa;
}


.item-promo{

    margin-top:4px;

    font-size:11px;

    color:#3ddc84;
}


.item-subtotal{

    margin-top:5px;

    color:#c89d38;

    font-size:12px;
}


.item-controles{

    display:flex;

    align-items:center;

    gap:7px;
}


.item-controles button{

    width:30px;

    height:30px;

    background:#222;

    border:1px solid #444;

    border-radius:7px;

    color:white;

    cursor:pointer;
}


.item-controles span{

    min-width:25px;

    text-align:center;

    font-weight:bold;
}


/* =========================================================
RESUMEN
========================================================= */

.carrito-resumen{

    margin-top:20px;

    padding-top:15px;

    border-top:1px solid #444;
}


.resumen-linea{

    display:flex;

    justify-content:space-between;

    margin-bottom:8px;

    font-size:14px;
}


.resumen-total{

    display:flex;

    justify-content:space-between;

    margin-top:12px;

    padding-top:12px;

    border-top:1px solid #333;

    color:#ffcc66;

    font-size:20px;

    font-weight:bold;
}


.proximo-nivel{

    margin-top:15px;

    padding:10px;

    border-radius:10px;

    background:
    rgba(200,157,56,.10);

    border:
    1px solid
    rgba(200,157,56,.25);

    color:#ddd;

    font-size:12px;

    text-align:center;

    line-height:1.5;
}


/* =========================================================
WHATSAPP FINAL
========================================================= */

.enviar-whatsapp{

    width:100%;

    margin-top:18px;

    padding:15px;

    border:none;

    border-radius:10px;

    background:#25D366;

    color:white;

    font-weight:bold;

    cursor:pointer;
}


/* =========================================================
RESPONSIVE
========================================================= */

@media(max-width:1450px){

    #productos{

        grid-template-columns:
        repeat(5,minmax(0,1fr));
    }
}


@media(max-width:1150px){

    #productos{

        grid-template-columns:
        repeat(4,minmax(0,1fr));
    }
}


@media(max-width:900px){

    #productos{

        grid-template-columns:
        repeat(3,minmax(0,1fr));
    }
}


@media(max-width:600px){

    body{

        padding:10px;

        padding-bottom:90px;
    }


    .marca{

        font-size:31px;

        letter-spacing:4px;
    }


    .modos{

        gap:7px;
    }


    .modo{

        font-size:11px;

        padding:11px 5px;
    }


    #buscar{

        padding:13px;

        font-size:14px;
    }


    .categorias{

        flex-wrap:nowrap;

        justify-content:flex-start;

        overflow-x:auto;

        padding-bottom:5px;
    }


    .categoria-btn{

        flex:none;
    }


    #productos{

        grid-template-columns:
        repeat(2,minmax(0,1fr));

        gap:10px;
    }


    .card{

        border-radius:12px;
    }


    .card:hover{

        transform:none;
    }


    .card img{

        height:190px;
    }


    .info{

        padding:10px;
    }


    .nombre{

        font-size:13px;

        min-height:48px;
    }


    .precio,
    .mayorista-precio{

        font-size:19px;
    }


    .agregar{

        font-size:10px;
    }


    .modal{

        padding:10px;
    }


    .modal-contenido{

        padding:15px;
    }
}

</style>

</head>

<body>

<!-- =========================================================
HEADER
========================================================= -->

<div class="header">

<div class="marca">
    <img src="logo.png" alt="AKKINO">
</div>

<div class="subtitulo">
    CATÁLOGO OFICIAL
</div>

</div>

<!-- =========================================================
MODOS
========================================================= -->

<div class="modos">

<button
    id="modoParticular"
    class="modo activo"
    onclick="cambiarModo('particular')">

    🛍️ PARTICULAR

</button>


<button
    id="modoMayorista"
    class="modo"
    onclick="cambiarModo('mayorista')">

    📦 MAYORISTA

</button>

</div>

<!-- =========================================================
BUSCADOR
========================================================= -->

<input
 id="buscar"
 placeholder="🔍 Buscar perfume...">

<!-- =========================================================
CATEGORÍAS
========================================================= -->

<div
    id="categorias"
    class="categorias">
</div>

<!-- =========================================================
PRODUCTOS
========================================================= -->

<div id="productos"></div>

<!-- =========================================================
PAGINACIÓN
========================================================= -->

<div id="paginacion"></div>

<!-- =========================================================
BARRA CARRITO
========================================================= -->

<div
    id="carritoBarra"
    class="carrito-barra">

<div class="carrito-contenido">

    <div
        id="carritoInfo"
        class="carrito-info">

        🛒
        <strong>0</strong>
        unidades

    </div>


    <button
        class="carrito-boton"
        onclick="abrirCarrito()">

        VER CARRITO

    </button>

</div>

</div>

<!-- =========================================================
MODAL
========================================================= -->

<div
    id="modalCarrito"
    class="modal">

<div class="modal-contenido">


    <div class="modal-header">

        <h2 id="tituloCarrito">
            🛒 Mi pedido
        </h2>

        <button
            class="cerrar"
            onclick="cerrarCarrito()">

            ×

        </button>

    </div>


    <div id="listaCarrito"></div>


    <div
        id="resumenCarrito"
        class="carrito-resumen">
    </div>


    <button
        class="enviar-whatsapp"
        onclick="enviarPedidoWhatsApp()">

        💬 ENVIAR PEDIDO POR WHATSAPP

    </button>


</div>

</div>



<script>

/* =========================================================
CONFIGURACIÓN
========================================================= */

const API =
"https://script.google.com/macros/s/AKfycbzzRC8QpE3t3qoI1qTYCr4dk5h5fz0wcffO3sjU3FWEb0H19SnGnZL0JOH9MIYwKr4-JA/exec";


const WHATSAPP =
"5493476552435";


const MINIMO_MAYORISTA =
5;


const PRODUCTOS_POR_PAGINA =
30;


/* =========================================================
VARIABLES
========================================================= */

let perfumes = [];

let carrito = [];

let modoActual =
    "particular";

let paginaActual =
    1;

let productosFiltrados =
    [];

let categoriaActual =
    "TODOS";


/* =========================================================
NÚMEROS
========================================================= */

function numero(valor){

    if(
        valor === null ||
        valor === undefined ||
        valor === ""
    ){

        return 0;
    }


    if(
        typeof valor ===
        "number"
    ){

        return valor;
    }


    let texto =
        String(valor)
        .trim()
        .replace(/ARS/gi,"")
        .replace(/\$/g,"")
        .replace(/\s/g,"");


    if(
        texto.includes(".") &&
        texto.includes(",")
    ){

        texto =
            texto
            .replace(/\./g,"")
            .replace(",",".");
    }

    else if(
        texto.includes(",")
    ){

        texto =
            texto.replace(
                ",",
                "."
            );
    }


    const resultado =
        Number(texto);


    return isNaN(resultado)
        ? 0
        : resultado;
}


/* =========================================================
FORMATO PRECIO
========================================================= */

function dinero(valor){

    return numero(valor)
        .toLocaleString(
            "es-AR",
            {
                minimumFractionDigits:0,
                maximumFractionDigits:0
            }
        );
}


/* =========================================================
CARGAR API
========================================================= */

fetch(API)

.then(respuesta => {

    if(!respuesta.ok){

        throw new Error(
            "HTTP " +
            respuesta.status
        );
    }

    return respuesta.json();
})

.then(data => {


    if(!Array.isArray(data)){

        throw new Error(
            data.error ||
            "Respuesta inválida."
        );
    }


    perfumes =
        data;


    crearCategorias();


    aplicarFiltros();

})

.catch(error => {


    console.error(
        error
    );


    document
    .getElementById(
        "productos"
    )
    .innerHTML = `

        <div style="
        grid-column:1/-1;
        text-align:center;
        padding:50px;
        color:#ff5a5a;
        ">

        No se pudieron cargar
        los perfumes.

        <br><br>

        <small>
        Revisá Apps Script
        y Google Sheets.
        </small>

        </div>

    `;
});


/* =========================================================
CATEGORÍAS
========================================================= */

function crearCategorias(){

    const cont =
        document
        .getElementById(
            "categorias"
        );


    const categorias =
        [
            ...new Set(

                perfumes

                .map(
                    p =>
                    String(
                        p.categoria || ""
                    ).trim()
                )

                .filter(Boolean)

            )
        ];


    let html = `

        <button
        class="categoria-btn activa"
        onclick="seleccionarCategoria('TODOS')"
        data-cat="TODOS">

        TODOS

        </button>

    `;


    categorias.forEach(cat => {

        html += `

            <button
            class="categoria-btn"
            onclick="seleccionarCategoria('${escapeJS(cat)}')"
            data-cat="${escapeHTML(cat)}">

            ${escapeHTML(cat)}

            </button>

        `;

    });


    cont.innerHTML =
        html;
}


/* =========================================================
SELECCIONAR CATEGORÍA
========================================================= */

function seleccionarCategoria(cat){

    categoriaActual =
        cat;


    document
    .querySelectorAll(
        ".categoria-btn"
    )
    .forEach(btn => {

        btn.classList.toggle(

            "activa",

            btn.dataset.cat ===
            cat

        );

    });


    paginaActual = 1;

    aplicarFiltros();
}


/* =========================================================
BUSCADOR
========================================================= */

document
.getElementById(
    "buscar"
)
.addEventListener(
    "input",
    () => {

        paginaActual = 1;

        aplicarFiltros();
    }
);


/* =========================================================
FILTROS
========================================================= */

function aplicarFiltros(){

    const texto =

        document
        .getElementById(
            "buscar"
        )
        .value
        .toLowerCase()
        .trim();


    productosFiltrados =

        perfumes.filter(
            p => {

                const nombre =

                    String(
                        p.perfume || ""
                    )
                    .toLowerCase();


                const categoria =

                    String(
                        p.categoria || ""
                    );


                return (

                    nombre.includes(
                        texto
                    )

                    &&

                    (
                        categoriaActual ===
                        "TODOS"

                        ||

                        categoria ===
                        categoriaActual
                    )

                );
            }
        );


    mostrarPagina();
}


/* =========================================================
CAMBIAR MODO
========================================================= */

function cambiarModo(modo){

    if(
        modo ===
        modoActual
    ){

        return;
    }


    modoActual =
        modo;


    /*
    VACIAMOS EL CARRITO
    PARA NO MEZCLAR PRECIOS
    PARTICULAR / MAYORISTA
    */

    carrito = [];


    actualizarCarrito();


    document
    .getElementById(
        "modoParticular"
    )
    .classList
    .toggle(
        "activo",
        modo ===
        "particular"
    );


    document
    .getElementById(
        "modoMayorista"
    )
    .classList
    .toggle(
        "activo",
        modo ===
        "mayorista"
    );


    document
    .getElementById(
        "tituloCarrito"
    )
    .textContent =

        modo ===
        "mayorista"

        ?

        "📦 Pedido mayorista"

        :

        "🛒 Mi carrito";


    paginaActual =
        1;


    mostrarPagina();
}


/* =========================================================
TOTAL UNIDADES
========================================================= */

function totalUnidades(){

    return carrito.reduce(

        (
            total,
            item
        ) =>

        total +
        item.cantidad,

        0
    );
}


/* =========================================================
CANTIDAD PRODUCTO
========================================================= */

function obtenerCantidad(
    perfume
){

    const item =
        carrito.find(
            x =>
            x.perfume ===
            perfume
        );


    return item
        ? item.cantidad
        : 0;
}


/* =========================================================
PRECIO MAYORISTA
========================================================= */

function precioMayorista(
    producto,
    total
){

/* =========================================================

========================================================= */

function escalaMayorista(
    total
){

    if(total >= 500) return "500+";

    if(total >= 250) return "250+";

    if(total >= 100) return "100+";

    if(total >= 50) return "50+";

    if(total >= 30) return "30+";

    if(total >= 20) return "20+";

    if(total >= 10) return "10+";

    return "5+";
}


/* =========================================================
PRÓXIMA ESCALA
========================================================= */

function proximaEscala(total){

    const escalas =
        [
            5,
            10,
            20,
            30,
            50,
            100,
            250,
            500
        ];


    return escalas.find(
        x => x > total
    ) || null;
}


/* =========================================================
CALCULAR PARTICULAR COMBINANDO VARIEDADES
========================================================= */

function calcularCarritoParticular(){

    let precioNormal = 0;

    const grupos = {};

    carrito.forEach(item => {

        const producto = item.producto;

        const unitario =
            numero(
                producto.precioParticular
            );

        const promo2 =
            numero(
                producto.promo2
            );

        const promo3 =
            numero(
                producto.promo3
            );

        precioNormal +=
            unitario * item.cantidad;

        if(
            promo2 <= 0 &&
            promo3 <= 0
        ){
            return;
        }

        /*
        Todos los perfumes que tengan
        los mismos valores de promo
        pueden combinarse entre sí.

        Ejemplo:
        1 Hawas + 1 Zanzibar
        con promo2 = 35000
        activa 2 x $35.000.
        */

        const clave =
            `${promo2}|${promo3}`;

        if(!grupos[clave]){

            grupos[clave] = {
                promo2,
                promo3,
                unidades:[]
            };
        }

        for(
            let i = 0;
            i < item.cantidad;
            i++
        ){

            grupos[clave]
            .unidades
            .push({
                perfume:item.perfume,
                precio:unitario
            });
        }
    });

    let totalFinal =
        precioNormal;

    const detallePromos = [];

    Object.values(grupos)
    .forEach(grupo => {

        const unidades =
            [...grupo.unidades]
            .sort(
                (a,b) =>
                b.precio - a.precio
            );

        const cantidad =
            unidades.length;

        if(cantidad === 0){
            return;
        }

        const totalNormalGrupo =
            unidades.reduce(
                (total,unidad) =>
                total + unidad.precio,
                0
            );

        let mejorTotal =
            totalNormalGrupo;

        let mejorPromo2 = 0;
        let mejorPromo3 = 0;

        const maxPromo3 =
            grupo.promo3 > 0
            ? Math.floor(cantidad / 3)
            : 0;

        for(
            let cantPromo3 = 0;
            cantPromo3 <= maxPromo3;
            cantPromo3++
        ){

            const usadasPor3 =
                cantPromo3 * 3;

            const disponibles =
                cantidad - usadasPor3;

            const maxPromo2 =
                grupo.promo2 > 0
                ? Math.floor(disponibles / 2)
                : 0;

            for(
                let cantPromo2 = 0;
                cantPromo2 <= maxPromo2;
                cantPromo2++
            ){

                const usadas =
                    cantPromo3 * 3 +
                    cantPromo2 * 2;

                const sobrantes =
                    unidades.slice(usadas);

                const costoSobrantes =
                    sobrantes.reduce(
                        (total,unidad) =>
                        total + unidad.precio,
                        0
                    );

                const costo =
                    cantPromo3 * grupo.promo3 +
                    cantPromo2 * grupo.promo2 +
                    costoSobrantes;

                if(costo < mejorTotal){

                    mejorTotal = costo;
                    mejorPromo2 = cantPromo2;
                    mejorPromo3 = cantPromo3;
                }
            }
        }

        totalFinal -=
            totalNormalGrupo - mejorTotal;

        if(mejorPromo3 > 0){

            detallePromos.push(
                `${mejorPromo3} ${
                    mejorPromo3 > 1
                    ? "promos"
                    : "promo"
                } de 3 x $${dinero(grupo.promo3)}`
            );
        }

        if(mejorPromo2 > 0){

            detallePromos.push(
                `${mejorPromo2} ${
                    mejorPromo2 > 1
                    ? "promos"
                    : "promo"
                } de 2 x $${dinero(grupo.promo2)}`
            );
        }
    });

    return {
        precioNormal,
        total:totalFinal,
        ahorro:precioNormal-totalFinal,
        descripcion:
            detallePromos.length
            ? detallePromos.join(" + ")
            : "Sin promociones aplicadas"
    };
}

/* =========================================================
AGREGAR PRODUCTO
========================================================= */

function agregarProducto(
    perfume
){

    const producto =

        perfumes.find(
            p =>
            p.perfume ===
            perfume
        );


    if(!producto){

        return;
    }


    const existente =

        carrito.find(
            x =>
            x.perfume ===
            perfume
        );


    if(existente){

        existente.cantidad++;
    }

    else{

        carrito.push({

            perfume:
                producto.perfume,

            cantidad:1,

            producto:
                producto

        });
    }


    actualizarCarrito();

    mostrarPagina();
}


/* =========================================================
CAMBIAR CANTIDAD
========================================================= */

function cambiarCantidad(
    perfume,
    cambio
){

    const item =

        carrito.find(
            x =>
            x.perfume ===
            perfume
        );


    if(!item){

        if(cambio > 0){

            agregarProducto(
                perfume
            );
        }

        return;
    }


    item.cantidad +=
        cambio;


    if(
        item.cantidad <= 0
    ){

        carrito =

            carrito.filter(
                x =>
                x.perfume !==
                perfume
            );
    }


    actualizarCarrito();

    mostrarPagina();
}

/* =========================================================
PAGINACIÓN
========================================================= */

function mostrarPaginacion(){

    const cont =

        document
        .getElementById(
            "paginacion"
        );


    const totalPaginas =

        Math.ceil(

            productosFiltrados.length
            /
            PRODUCTOS_POR_PAGINA

        );


    if(
        totalPaginas <= 1
    ){

        cont.innerHTML =
            "";

        return;
    }


    let html =
        `<div class="paginacion">`;


    html += `

        <button
        class="pagina-btn"
        onclick="cambiarPagina(${paginaActual-1})"
        ${paginaActual === 1 ? "disabled" : ""}>

        ‹

        </button>

    `;


    for(
        let i=1;
        i<=totalPaginas;
        i++
    ){


        if(

            totalPaginas > 8

            &&

            i !== 1

            &&

            i !== totalPaginas

            &&

            Math.abs(
                i-paginaActual
            ) > 2

        ){

            continue;
        }


        html += `

            <button
            class="pagina-btn ${i === paginaActual ? "activa" : ""}"
            onclick="cambiarPagina(${i})">

            ${i}

            </button>

        `;
    }


    html += `

        <button
        class="pagina-btn"
        onclick="cambiarPagina(${paginaActual+1})"
        ${paginaActual === totalPaginas ? "disabled" : ""}>

        ›

        </button>

        </div>

    `;


    const inicio =

        (
            paginaActual -
            1
        )

        *

        PRODUCTOS_POR_PAGINA

        + 1;


    const fin =

        Math.min(

            paginaActual *
            PRODUCTOS_POR_PAGINA,

            productosFiltrados.length

        );


    html += `

        <div
        class="paginacion-info">

        Mostrando
        ${inicio}–${fin}
        de
        ${productosFiltrados.length}
        perfumes

        </div>

    `;


    cont.innerHTML =
        html;
}


/* =========================================================
CAMBIAR PÁGINA
========================================================= */

function cambiarPagina(
    pagina
){

    const totalPaginas =

        Math.ceil(

            productosFiltrados.length
            /
            PRODUCTOS_POR_PAGINA

        );


    if(
        pagina < 1 ||
        pagina > totalPaginas
    ){

        return;
    }


    paginaActual =
        pagina;


    mostrarPagina();


    window.scrollTo({

        top:0,

        behavior:"smooth"
    });
}


/* =========================================================
ESCAPAR HTML
========================================================= */

function escapeHTML(text){

    return String(
        text ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}


/* =========================================================
ESCAPAR JS
========================================================= */

function escapeJS(text){

    return String(
        text ?? ""
    )

    .replace(
        /\\/g,
        "\\\\"
    )

    .replace(
        /'/g,
        "\\'"
    )

    .replace(
        /\r/g,
        ""
    )

    .replace(
        /\n/g,
        "\\n"
    );
}


/* =========================================================
CERRAR MODAL TOCANDO AFUERA
========================================================= */

document
.getElementById(
    "modalCarrito"
)
.addEventListener(
    "click",
    function(e){

        if(
            e.target ===
            this
        ){

            cerrarCarrito();
        }
    }
);

</script>
